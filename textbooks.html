<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교과서 — 교육 브리핑</title>
<meta name="description" content="경기 수원 · 화성 · 용인 · 오산 중학교의 학년별 영어 교과서와 단원별 핵심 문법">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23cc4210'/%3E%3Crect x='7' y='17' width='18' height='7' fill='%23ffe14d'/%3E%3Cpath d='M9 10h14M9 15h10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 교과서 화면: 검색 하나, 보기 셋(학교 · 지도 · 교과서), 지역 한 줄.
   학교를 누르면 중1 · 중2 · 중3 교과서와 단원이 한 화면에 다 나온다. 따로 고르는 탭은 두지 않는다.
   이 파일이 사이트의 textbooks.html 그대로다 (tools/make_site_textbooks.py 가 site/ 로 옮긴다). */
:root {
  --ground: #ffffff; --raised: #f3f4f6; --raised-2: #e7e8ec; --border: #e5e7eb;
  --text: #0f1115; --muted: #5f6672; --accent: #cc4210; --on-accent: #ffffff; --marker: #ffe14d;
  --ok-bg: #dcfce7; --ok-fg: #14532d; --warn-bg: #fffbeb; --warn-fg: #92400e; --bad-bg: #ffedea; --bad-fg: #831c1e;
  --tab-h: 56px;
  --font: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000; --raised: #121212; --raised-2: #1f1f1f; --border: #262626;
    --text: #f5f5f5; --muted: #a8a8a8; --accent: #ff7a45; --on-accent: #120309;
    --ok-bg: #12301f; --ok-fg: #a7e3bd; --warn-bg: #33270d; --warn-fg: #f3d08a; --bad-bg: #3a1813; --bad-fg: #f5b4a7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000; --raised: #121212; --raised-2: #1f1f1f; --border: #262626;
  --text: #f5f5f5; --muted: #a8a8a8; --accent: #ff7a45; --on-accent: #120309;
  --ok-bg: #12301f; --ok-fg: #a7e3bd; --warn-bg: #33270d; --warn-fg: #f3d08a; --bad-bg: #3a1813; --bad-fg: #f5b4a7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); margin: 0; }
body { color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
::selection { background: var(--marker); color: #111111; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gutter { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }

/* 맨 위 막대 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ground); border-bottom: 1px solid var(--border); }
.top .gutter { height: 56px; display: flex; align-items: center; gap: 4px; }
.logo { font-size: 21px; font-weight: 800; letter-spacing: -0.04em; text-decoration: none; }
.logo b { color: var(--accent); font-weight: 800; }
.icon-btn { width: 44px; height: 44px; flex: none; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .1s; }
.icon-btn:hover { background: var(--raised); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 24px; height: 24px; }
#back-slot .icon-btn { margin-left: -10px; }

/* 처음 화면: 검색, 보기 셋, 지역 한 줄 */
.search { position: relative; display: block; margin-top: 14px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--raised); padding: 0 14px 0 44px; font-size: 17px; }
.search input::placeholder { color: var(--muted); }
.seg { display: flex; margin-top: 10px; background: var(--raised); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border: 0; background: none; border-radius: 9px; font-size: 16px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button svg { width: 19px; height: 19px; }
.seg button[aria-pressed="true"] { background: var(--ground); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.seg.small { display: inline-flex; flex: none; margin-top: 0; border-radius: 10px; padding: 3px; }
.seg.small button { flex: none; min-width: 54px; height: 38px; border-radius: 8px; font-size: 15px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)) 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--ground); color: var(--text); font-size: 15px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.chip i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip .n { font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--ground); }
.chip[aria-pressed="true"] .n { color: inherit; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 2px; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.sec-h .n { font-size: 14px; font-weight: 500; color: var(--muted); }
.hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.empty { padding: 44px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty b { color: var(--text); font-size: 17px; }

/* 학교 한 줄: 이름, 중1 · 중2 · 중3 교과서, 내 학교 별 */
.s-list { display: flex; flex-direction: column; }
.s-row { position: relative; border-bottom: 1px solid var(--border); }
.s-main { width: 100%; min-height: 72px; padding: 13px 0; border: 0; background: none; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 6px; border-radius: 8px; }
.s-name { display: flex; align-items: baseline; gap: 8px; padding-right: 40px; }
.s-name b { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.s-main:hover .s-name b { text-decoration: underline; text-underline-offset: 3px; }
.s-reg { font-size: 13px; color: var(--muted); }
.s-books { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 14px; color: var(--muted); }
.s-b { display: flex; align-items: center; gap: 4px; min-width: 0; }
.s-b i, .dot { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--muted)); }
.s-b .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-b.none { opacity: .6; }
.star { position: absolute; top: 4px; right: -8px; }
.star svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; color: var(--muted); }
.star[aria-pressed="true"] svg { fill: currentColor; color: var(--accent); }
.mine { padding-bottom: 4px; }

/* 교과서 한 줄 */
.b-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 13px 0; border: 0; border-bottom: 1px solid var(--border); background: none; text-align: left; cursor: pointer; }
.b-row .sw { flex: none; width: 12px; height: 44px; border-radius: 4px; background: var(--c, var(--muted)); }
.b-row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.b-row b { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.b-row:hover b { text-decoration: underline; text-underline-offset: 3px; }
.b-row .sub { font-size: 14px; color: var(--muted); }
.b-row .chev { flex: none; width: 20px; height: 20px; color: var(--muted); }

/* 학교 화면 · 교과서 화면 */
.page-h { padding: 18px 0 4px; display: flex; flex-direction: column; gap: 8px; }
.page-h h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.25; text-wrap: balance; }
.page-h .meta { font-size: 15px; color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--raised); color: var(--text); font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; transition: transform .1s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btn[aria-pressed="true"] { background: var(--text); color: var(--ground); }
.btn[aria-pressed="true"] svg { fill: currentColor; }

/* 학교 화면 맨 위: 세 학년 교과서 한눈에 */
.glance { margin-top: 16px; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.glance button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer; }
.glance button:first-child { border-top: 0; }
.glance button:hover { background: var(--raised); }
.glance .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.glance .nm small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.glance .chev { flex: none; width: 20px; height: 20px; color: var(--muted); }
/* 학년 묶음: 학년 표시, 교과서 이름, 단원 줄 */
.grade { margin-top: 26px; }
.g-head { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--text); scroll-margin-top: 72px; }
.g-tag { flex: none; min-width: 44px; height: 30px; padding: 0 9px; border-radius: 8px; background: var(--c, var(--text)); color: var(--c-ink, var(--ground)); display: inline-grid; place-items: center; font-size: 15px; font-weight: 800; }
.g-head h2 { flex: 1; min-width: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
.g-head h2 button { border: 0; background: none; padding: 0; min-height: 44px; font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px; }
.g-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; margin-top: 4px; font-size: 14px; color: var(--muted); }
.g-sub a { display: inline-flex; align-items: center; min-height: 40px; color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.g-note { margin-top: 8px; font-size: 14px; line-height: 1.55; color: var(--muted); }
.pill { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.bad { background: var(--bad-bg); color: var(--bad-fg); }

/* 단원 줄: 번호, 제목, 문법. 누르면 본문 제목 · 말하기 · 주제가 펼쳐진다 */
.u { border-bottom: 1px solid var(--border); }
.u summary { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 8px; align-items: start; padding: 13px 0; cursor: pointer; list-style: none; }
.u summary::-webkit-details-marker { display: none; }
.u-no { font-size: 20px; font-weight: 800; line-height: 1.3; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.u-no.x { font-size: 13px; font-weight: 700; line-height: 1.5; color: var(--muted); padding-top: 4px; }
.u-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.u-t b { font-size: 17px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; }
.u-g { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.u-g mark { background: var(--raised); color: var(--text); border-radius: 6px; padding: 3px 8px; font-size: 15px; font-weight: 600; line-height: 1.4; }
.u summary .chev { width: 20px; height: 20px; margin-top: 4px; color: var(--muted); transition: transform .15s; }
.u[open] summary .chev { transform: rotate(180deg); }
.u-more { margin: 0; padding: 0 0 14px 48px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.55; }
.u-more div { display: flex; gap: 8px; }
.u-more .k { flex: none; width: 44px; color: var(--muted); font-size: 14px; }
.u-more div span:last-child { min-width: 0; }
.u-more .btn { align-self: flex-start; margin-top: 4px; }

/* 다음 학년도 교과서 · 쓰는 학교: 접어 두는 칸 */
.fold { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; }
.fold > summary { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 14px; cursor: pointer; list-style: none; font-size: 15px; font-weight: 700; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary span { flex: 1; min-width: 0; }
.fold > summary .chev { flex: none; width: 20px; height: 20px; color: var(--muted); transition: transform .15s; }
.fold[open] > summary .chev { transform: rotate(180deg); }
.fold-in { padding: 0 14px 12px; }
.fold-in .u:last-child { border-bottom: 0; }
.users { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.users h3 { font-size: 14px; font-weight: 700; color: var(--muted); }
.users .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.users .names button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--raised); font-size: 15px; font-weight: 600; cursor: pointer; }

/* 지도 보기 */
.map-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0 0; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.map-bar .chips { flex: 1; min-width: 0; margin: 0; padding: 2px max(16px, env(safe-area-inset-right, 0px)) 2px 0; }
.map { position: relative; z-index: 0; height: min(54vh, 520px); min-height: 300px; margin: 8px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; background: var(--raised); }
@media (min-width: 752px) { .map { margin: 8px 0 0; border-radius: 12px; overflow: hidden; } }
.map .skel { position: absolute; inset: 0; border-radius: 0; }
.map .leaflet-container { width: 100%; height: 100%; font: inherit; background: var(--raised); }
.map .leaflet-control-attribution { font-size: 11px; }
.map .lbl { background: var(--ground); color: var(--text); border: 0; border-radius: 6px; padding: 2px 6px; font-size: 12px; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.25); white-space: nowrap; }
.map .lbl::before { display: none; }
.map:not(.z-lbl) .lbl { display: none; }
.map .mine-ring { stroke: var(--text); }
.map-fail { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: var(--muted); }
.map-fail b { color: var(--text); font-size: 17px; }
.map-card { margin-top: 10px; border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; }
.map-card .s-row { border-bottom: 0; }
.map-card .star { right: -4px; }
.map-card .addr { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); } }
:root[data-theme="dark"] .map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }

/* 알림 · 바닥 글 · 자리 표시 · 아래 탭 막대 */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); transform: translate(-50%, 16px); opacity: 0; z-index: 60; background: var(--text); color: var(--ground); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
footer { border-top: 1px solid var(--border); margin-top: 36px; padding-block: 20px 36px; color: var(--muted); font-size: 13px; line-height: 1.7; display: flex; flex-direction: column; gap: 6px; }
.skel { display: block; border-radius: 10px; background: var(--raised); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--ground); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: center; }
.tabbar a { flex: 1; max-width: 160px; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; }
.tabbar a[aria-current="page"] { color: var(--text); }
.tabbar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] svg { fill: currentColor; }
.tabbar a:active svg { transform: scale(.9); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="gutter">
    <span id="back-slot"></span>
    <a class="logo" href="#schools" aria-label="교과서 찾기 처음으로">교과서<b>찾기</b></a>
  </div>
</header>

<main class="gutter" id="app">
  <!-- 불러오는 동안: 검색 칸, 보기 고르기, 학교 줄 모양의 자리 표시 -->
  <div aria-hidden="true">
    <span class="skel" style="height:48px;margin-top:14px"></span>
    <span class="skel" style="height:48px;margin-top:10px"></span>
    <span class="skel" style="height:64px;margin-top:22px"></span>
    <span class="skel" style="height:64px;margin-top:10px"></span>
    <span class="skel" style="height:64px;margin-top:10px"></span>
  </div>
</main>

<footer class="gutter" id="foot">
  <p>교과서 본문과 지문은 싣지 않습니다. 단원 제목, 본문 제목, 핵심 문법, 의사소통 기능만 정리했습니다.</p>
</footer>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");

    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',

    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>',

  };

  // 출판사 색 [바탕, 글자] — 브리핑 카드와 같은 색
  var PALETTE = [["#cc4210", "#ffffff"], ["#0b7a6b", "#ffffff"], ["#1659e6", "#ffffff"], ["#ffd23f", "#111111"], ["#d6336c", "#ffffff"], ["#3d6b21", "#ffffff"], ["#6b7280", "#ffffff"]];
  function pubColor(pub) {
    pub = pub || "";
    if (/동아/.test(pub)) return PALETTE[0];
    if (/천재/.test(pub)) return PALETTE[2];
    if (/능률|NE/.test(pub)) return PALETTE[1];
    if (/YBM|와이비엠/.test(pub)) return PALETTE[4];
    if (/미래엔/.test(pub)) return PALETTE[5];

  }
  function paint(node, c) { node.style.setProperty("--c", c[0]); node.style.setProperty("--c-ink", c[1]); return node; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function iconBtn(name, label) {
    var b = el("button", "icon-btn"); b.type = "button"; b.innerHTML = ICON[name]; b.setAttribute("aria-label", label); return b;
  }
  function store(k, v) { try { localStorage.setItem("tb." + k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem("tb." + k); } catch (e) { return null; } }
  /* 내 학교: 별을 누른 학교의 번호 목록. 이 기기에만 남는다 */
  function getMine() { try { var a = JSON.parse(recall("mine") || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function isMine(code) { return getMine().indexOf(code) >= 0; }
  function toggleMine(code) {
    var a = getMine(), at = a.indexOf(code);
    if (at >= 0) a.splice(at, 1); else a.push(code);
    store("mine", JSON.stringify(a));
    toast(at >= 0 ? "내 학교에서 뺐습니다" : "내 학교에 넣었습니다");
  }
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.classList.remove("on"); }, 1600); }
  function regionShort(r) { return r.replace(/^경기\s*/, ""); }
  function shortSchool(s) { return s.replace(/중학교$/, "중"); }
  function shortPub(p) { return p.replace(/출판$|출판사$|교과서$|교육$/, "").replace("NE능률", "능률"); }
  function bookKey(t, g) { return [t.publisher, t.author, t.curriculum, g].join("|"); }
  function serKey(t) { return t.publisher + "|" + t.author; }
  function unitLabel(no) { return /^S/.test(no) ? "번외" : no; }
  function yearOf(s) { return s.years["2026"] || s.years[Object.keys(s.years).sort()[0]] || {}; }
  function norm(x) { return (x || "").replace(/\s/g, "").toLowerCase(); }
  function copyText(text) {
    function fail() { toast("복사하지 못했습니다. 글자를 길게 눌러 복사하세요"); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("복사했습니다"); }, fail); else fail();
    } catch (e) { fail(); }
  }
  function unitText(b, u) {
    return b.publisher + " " + b.author + " 중" + b.grade + " " + (/^S/.test(u.no) ? "번외" : u.no + "과") + " " + (u.title || "") +
      (u.reading ? "\n본문 제목: " + u.reading : "") +
      "\n문법: " + (u.grammar.join(", ") || "-") +
      (u.functions.length ? "\n의사소통 기능: " + u.functions.join(", ") : "") +

  /* 화면 이동: 주소의 # 가 곧 화면이다 (휴대폰 뒤로 가기가 그대로 동작) */
  var moved = 0, homeY = 0, onHome = false;
  function nav(h) { if (onHome) homeY = window.scrollY; moved++; location.hash = h; }
  function goBack() { if (moved > 0) { moved--; history.back(); } else location.hash = "#schools"; }
  function setBack(on) {
    backSlot.textContent = "";
    if (!on) return;
    var b = iconBtn("back", "뒤로");
    b.addEventListener("click", goBack);
    backSlot.appendChild(b);
  }
  function route() {
    if (!DATA) return;
    dropMap();
    var h = location.hash, m;
    try { h = decodeURIComponent(h); } catch (e) {}
    if ((m = /^#s-(\d+)$/.exec(h))) {
      var i = DATA.schools.findIndex(function (s) { return s.code === m[1]; });
      if (i >= 0) { onHome = false; renderSchool(i); window.scrollTo(0, 0); return; }
    }
    if (h.indexOf("#b-") === 0 && SER[h.slice(3)]) { onHome = false; renderBook(h.slice(3)); window.scrollTo(0, 0); return; }
    var back = !onHome;
    onHome = true;
    renderHome();
    if (back) window.scrollTo(0, homeY);
  }
  window.addEventListener("hashchange", route);

  /* 지도: 지도 보기를 열 때만 Leaflet 과 OpenStreetMap 지도 그림을 불러온다 */
  var LEAFLET = "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet";
  var LEAFLET_SRI = { js: "sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH", css: "sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" };
  var leafletP = null, MAP = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletP) return leafletP;
    leafletP = new Promise(function (ok, fail) {
      var c = document.createElement("link"); c.rel = "stylesheet"; c.href = LEAFLET + ".css"; c.integrity = LEAFLET_SRI.css; c.crossOrigin = "anonymous";
      document.head.appendChild(c);
      var j = document.createElement("script"); j.src = LEAFLET + ".js"; j.integrity = LEAFLET_SRI.js; j.crossOrigin = "anonymous";
      j.onload = function () { if (window.L) ok(); else { leafletP = null; fail(); } };
      j.onerror = function () { leafletP = null; j.remove(); fail(); };
      document.head.appendChild(j);
    });
    return leafletP;
  }
  function dropMap() { if (MAP) { try { MAP.remove(); } catch (e) {} MAP = null; } }

  /* 학교 한 줄 */
  function schoolRow(i, showRegion, onStar) {
    var s = DATA.schools[i], y = yearOf(s);
    var row = el("div", "s-row");
    var main = el("button", "s-main"); main.type = "button";
    var nm = el("span", "s-name");
    nm.appendChild(el("b", null, shortSchool(s.school)));
    if (showRegion) nm.appendChild(el("span", "s-reg", regionShort(s.region)));
    main.appendChild(nm);
    var bk = el("span", "s-books"), said = [];
    ["1", "2", "3"].forEach(function (g) {
      var t = y[g];
      var c = el("span", "s-b" + (t ? "" : " none"));
      if (t) c.appendChild(paint(el("i"), pubColor(t.publisher)));
      c.appendChild(el("span", "tx", g + " " + (t ? shortPub(t.publisher) + " " + t.author : "자료 없음")));
      bk.appendChild(c);
      said.push("중" + g + " " + (t ? t.publisher + " " + t.author : "자료 없음"));
    });
    main.appendChild(bk);
    main.setAttribute("aria-label", s.school + ", " + said.join(", "));
    main.addEventListener("click", function () { nav("#s-" + s.code); });
    row.appendChild(main);
    var st = iconBtn("star", ""); st.classList.add("star");
    st.setAttribute("data-star", s.code);
    function sync(b) { var on = isMine(s.code); b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", s.school + (on ? " 내 학교에서 빼기" : " 내 학교에 넣기")); }
    sync(st);
    st.addEventListener("click", function () {
      var before = st.getBoundingClientRect().top, inMine = !!st.closest(".mine");
      toggleMine(s.code);
      if (onStar) onStar();
      app.querySelectorAll('[data-star="' + s.code + '"]').forEach(sync);
      // 위쪽 "내 학교" 높이가 바뀌어도 누른 줄이 제자리에 있게 한다
      var now = st.isConnected ? st : app.querySelector((inMine ? ".mine " : ".s-list:not(.mine) ") + '[data-star="' + s.code + '"]');
      if (now) window.scrollBy(0, now.getBoundingClientRect().top - before);
    });
    row.appendChild(st);
    return row;
  }

  /* 교과서 한 줄: 한 종(출판사 · 저자)에 학년별 쓰는 학교 수 */
  function seriesCount(k, y, g) { var u = SER[k].use[y]; return u && u[g] ? u[g].length : 0; }
  function seriesTotal(k) {
    var seen = {}, u = SER[k].use["2026"] || {};
    Object.keys(u).forEach(function (g) { u[g].forEach(function (i) { seen[i] = 1; }); });
    return Object.keys(seen).length;
  }
  function seriesRow(k) {
    var sr = SER[k];
    var b = paint(el("button", "b-row"), pubColor(sr.publisher)); b.type = "button";
    b.appendChild(el("span", "sw"));
    var t = el("span", "t");
    t.appendChild(el("b", null, sr.publisher + " " + sr.author));
    var parts = ["1", "2", "3"].map(function (g) { var n = seriesCount(k, "2026", g); return n ? "중" + g + " " + n + "곳" : null; }).filter(Boolean);
    if (!parts.length) { var n27 = seriesCount(k, "2027", "3"); if (n27) parts.push("2027 중3 " + n27 + "곳"); }
    // 2015 개정 책만 있는 종(중3 전용)은 2026학년도까지만 쓰인다
    var only2015 = sr.cur["2015"] && !sr.cur["2022"];
    t.appendChild(el("span", "sub", (parts.join(" · ") || "쓰는 학교 없음") + (only2015 ? " · 2026학년도까지" : "")));
    b.appendChild(t);
    b.insertAdjacentHTML("beforeend", ICON.right);
    b.addEventListener("click", function () { nav("#b-" + encodeURIComponent(k)); });
    return b;
  }

  /* 처음 화면: 검색, 보기(학교 · 지도 · 교과서), 지역 */
  function renderHome() {
    setBack(false);
    app.textContent = "";
    app.appendChild(el("h1", "sr", "학교별 영어 교과서 찾기"));

    var box = el("label", "search");
    box.innerHTML = ICON.search;
    var inp = el("input"); inp.type = "search"; inp.id = "q"; inp.value = state.q; inp.autocomplete = "off"; inp.enterKeyHint = "search";
    inp.placeholder = "학교나 교과서 이름"; inp.setAttribute("aria-label", "학교나 교과서 이름으로 찾기");
    box.appendChild(inp);
    app.appendChild(box);

    var seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "보는 방법");
    [["list", "학교", "list"], ["map", "지도", "map"], ["books", "교과서", "book"]].forEach(function (v) {
      var b = el("button"); b.type = "button"; b.innerHTML = ICON[v[2]]; b.appendChild(el("span", null, v[1]));
      b.setAttribute("aria-pressed", String(state.view === v[0]));
      b.addEventListener("click", function () { state.view = v[0]; store("view", v[0]); renderHome(); });
      seg.appendChild(b);
    });
    app.appendChild(seg);

    var body = el("div");
    app.appendChild(body);

    function regionChips() {
      var cr = el("div", "chips"); cr.setAttribute("role", "group"); cr.setAttribute("aria-label", "지역");
      [["all", "전체", DATA.schools.length]].concat(REGIONS.map(function (r) { return [r, regionShort(r), DATA.schools.filter(function (s) { return s.region === r; }).length]; })).forEach(function (r) {
        var b = el("button", "chip"); b.type = "button";
        b.appendChild(el("span", null, r[1])); b.appendChild(el("span", "n", r[2] + "곳"));
        b.setAttribute("aria-pressed", String(state.region === r[0]));
        b.addEventListener("click", function () { state.region = r[0]; store("region", r[0]); state.mpick = null; fill(); });
        cr.appendChild(b);
      });
      return cr;
    }
    function fill() {
      dropMap();
      body.textContent = "";
      var q = norm(state.q);
      var sers = SERKEYS.filter(function (k) { var sr = SER[k]; return !q || norm(sr.publisher + sr.author).indexOf(q) >= 0 || norm(shortPub(sr.publisher) + sr.author).indexOf(q) >= 0; });
      var list = DATA.schools.map(function (s, i) { return i; }).filter(function (i) {
        var s = DATA.schools[i];
        return q ? norm(s.school).indexOf(q) >= 0 || norm(regionShort(s.region)) === q : state.region === "all" || s.region === state.region;
      });

      if (state.region === "all" || q) list.sort(function (a, b) { return DATA.schools[a].school.localeCompare(DATA.schools[b].school, "ko"); });
      if (state.view === "books") {
        if (!sers.length) { body.appendChild(empty("찾는 교과서가 없습니다", "출판사나 저자 이름 일부만 넣어 보세요. 예: 동아, 윤정미")); return; }
        var h = el("h2", "sec-h", q ? "찾은 교과서" : "교과서"); h.appendChild(el("span", "n", sers.length + "종 · 쓰는 학교가 많은 순")); body.appendChild(h);
        sers.forEach(function (k) { body.appendChild(seriesRow(k)); });
        return;
      }
      if (!q) body.appendChild(regionChips());
      if (state.view === "map") {
        if (!list.length) { body.appendChild(empty("찾는 학교가 없습니다", "학교 이름 일부만 넣어 보세요. 예: 동탄, 광교")); return; }
        fillMap(body, list, !!q);
        return;
      }
      // 학교 보기
      var mine = q ? [] : getMine().map(function (code) { return DATA.schools.findIndex(function (s) { return s.code === code; }); }).filter(function (i) { return i >= 0; });
      if (mine.length) {
        var mh = el("h2", "sec-h", "내 학교"); mh.appendChild(el("span", "n", mine.length + "곳")); body.appendChild(mh);
        var ml = el("div", "s-list mine");
        mine.forEach(function (i) { ml.appendChild(schoolRow(i, true, fill)); });
        body.appendChild(ml);
      }
      if (q && sers.length && sers.length < SERKEYS.length) {
        var bh = el("h2", "sec-h", "교과서"); bh.appendChild(el("span", "n", sers.length + "종")); body.appendChild(bh);
        sers.forEach(function (k) { body.appendChild(seriesRow(k)); });
      }
      if (!list.length) {
        if (!(q && sers.length)) body.appendChild(empty("찾는 학교가 없습니다", "학교 이름 일부만 넣어 보세요. 예: 동탄, 광교"));
        return;
      }
      var lh = el("h2", "sec-h", q ? "학교" : (state.region === "all" ? "모든 학교" : regionShort(state.region) + " 학교"));
      lh.appendChild(el("span", "n", list.length + "곳")); body.appendChild(lh);
      if (!q && !mine.length) body.appendChild(el("p", "hint", "별을 누르면 \"내 학교\"로 맨 위에 모입니다. 줄의 1 · 2 · 3 은 학년입니다."));
      var sl = el("div", "s-list");
      list.forEach(function (i) { sl.appendChild(schoolRow(i, !!q || state.region === "all", fill)); });
      body.appendChild(sl);
    }
    function empty(title, sub) { var e = el("div", "empty"); e.appendChild(el("b", null, title)); e.appendChild(el("span", null, sub)); return e; }
    inp.addEventListener("input", function () { state.q = inp.value; state.mpick = null; fill(); });
    fill();
  }

  /* 지도 보기: list 는 지금 지역(또는 검색 결과)의 학교 번호들 */
  function fillMap(body, list, searching) {
    var inList = {};
    list.forEach(function (i) { inList[i] = true; });
    var bar = el("div", "map-bar");
    var seg = el("div", "seg small"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "점 색으로 볼 학년");
    var segBtns = {};
    ["1", "2", "3"].forEach(function (g) {
      var b = el("button", null, "중" + g); b.type = "button";
      b.addEventListener("click", function () { state.mgrade = g; state.mbook = null; store("mgrade", g); paintAll(); });
      seg.appendChild(b); segBtns[g] = b;
    });
    bar.appendChild(seg);
    var legend = el("div", "chips"); legend.setAttribute("role", "group"); legend.setAttribute("aria-label", "교과서로 골라 보기");
    bar.appendChild(legend);
    body.appendChild(bar);
    var box = el("div", "map");
    box.appendChild(el("span", "skel"));
    body.appendChild(box);
    var card = el("div");
    body.appendChild(card);
    body.appendChild(el("p", "hint", "점 색은 고른 학년 교과서의 출판사입니다. 교과서 이름을 누르면 그 책을 쓰는 학교만 남고, 점을 누르면 그 학교가 지도 아래에 나옵니다. 학교 위치는 한국교육시설안전원 전국초중등학교위치표준데이터(2026-10-01 기준), 지도 그림은 OpenStreetMap 입니다. 지도를 열 때만 OpenStreetMap 과 jsDelivr 에 연결합니다."));

    var marks = {};   // 학교 번호 → { dot, ring }
    function bookOf(i) { var t = yearOf(DATA.schools[i])[state.mgrade]; return t ? serKey(t) : null; }
    function pick(i) {
      var s = DATA.schools[i];
      state.mpick = s.code;
      card.textContent = ""; card.className = "map-card";
      card.appendChild(schoolRow(i, true));
      if (s.addr) card.appendChild(el("p", "addr", s.addr));
      Object.keys(marks).forEach(function (k) { marks[k].dot.setStyle({ weight: +k === i ? 4 : 2 }); });
      if (marks[i]) marks[i].dot.bringToFront();
    }
    function paintAll() {
      Object.keys(segBtns).forEach(function (g) { segBtns[g].setAttribute("aria-pressed", String(g === state.mgrade)); });
      var counts = {}, order = [];
      list.forEach(function (i) { var k = bookOf(i); if (!k) return; if (!counts[k]) { counts[k] = 0; order.push(k); } counts[k]++; });
      order.sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, "ko"); });
      if (state.mbook && !counts[state.mbook]) state.mbook = null;
      legend.textContent = "";
      order.forEach(function (k) {
        var p = k.split("|");
        var b = el("button", "chip"); b.type = "button";
        b.appendChild(paint(el("i"), pubColor(p[0])));
        b.appendChild(el("span", null, shortPub(p[0]) + " " + p[1]));
        b.appendChild(el("span", "n", counts[k] + "곳"));
        b.setAttribute("aria-pressed", String(state.mbook === k));
        b.setAttribute("aria-label", p[0] + " " + p[1] + " " + counts[k] + "곳" + (state.mbook === k ? ", 골라 보는 중" : ", 이 교과서만 보기"));
        b.addEventListener("click", function () { state.mbook = state.mbook === k ? null : k; paintAll(); });
        legend.appendChild(b);
      });
      Object.keys(marks).forEach(function (key) {
        var i = +key, k = bookOf(i), on = !state.mbook || k === state.mbook;
        var c = k ? pubColor(k.split("|")[0])[0] : "#9aa0a8";
        marks[i].dot.setStyle({ fillColor: c, fillOpacity: on ? 1 : .18, opacity: on ? 1 : .25, radius: on ? 8 : 5 });
        if (on) marks[i].dot.bringToFront();
        if (marks[i].ring) marks[i].ring.setStyle({ opacity: on ? 1 : .25 });
      });
    }
    paintAll();

    loadLeaflet().then(function () {
      if (!box.isConnected) return;
      box.textContent = "";
      var L = window.L;
      MAP = L.map(box, { zoomControl: true });
      MAP.attributionControl.setPrefix(false);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
      }).addTo(MAP);
      var pts = [], mine = getMine();
      DATA.schools.forEach(function (s, i) {
        if (typeof s.lat !== "number") return;
        if (searching && !inList[i]) return;
        var ll = [s.lat, s.lng], m = {};
        if (mine.indexOf(s.code) >= 0) m.ring = L.circleMarker(ll, { radius: 13, color: "#111111", weight: 2.5, fill: false, interactive: false, className: "mine-ring" }).addTo(MAP);
        m.dot = L.circleMarker(ll, { radius: 8, color: "#ffffff", weight: 2, fillOpacity: 1 }).addTo(MAP);
        m.dot.bindTooltip(shortSchool(s.school), { permanent: true, direction: "top", offset: [0, -8], className: "lbl" });
        m.dot.on("click", function () { pick(i); });
        marks[i] = m;
        if (inList[i]) pts.push(ll);
      });
      function labels() { box.classList.toggle("z-lbl", MAP.getZoom() >= 14); }
      MAP.on("zoomend", labels);
      var focus = state.mpick ? DATA.schools.findIndex(function (s) { return s.code === state.mpick; }) : -1;
      if (focus >= 0 && marks[focus]) { MAP.setView([DATA.schools[focus].lat, DATA.schools[focus].lng], 15); pick(focus); }
      else if (pts.length) MAP.fitBounds(pts, { padding: [28, 28], maxZoom: 15 });
      else MAP.setView([37.25, 127.05], 11);
      labels();
      paintAll();
    }, function () {
      if (!box.isConnected) return;
      box.textContent = "";
      var f = el("div", "map-fail");
      f.appendChild(el("b", null, "지도를 불러오지 못했습니다"));
      f.appendChild(el("span", null, "인터넷 연결을 확인하고 다시 눌러 보세요. 학교 보기는 그대로 쓸 수 있습니다."));
      var rb = el("button", "btn", "다시 불러오기"); rb.type = "button";
      rb.addEventListener("click", function () { renderHome(); });
      f.appendChild(rb);
      box.appendChild(f);
    });
  }

  /* 단원 줄들. 번호 · 제목 · 문법이 바로 보이고, 누르면 본문 제목 · 말하기 · 주제 */
  function unitList(b) {
    var wrap = el("div", "units");
    b.units.forEach(function (u) {
      var d = el("details", "u");
      var sm = el("summary");
      sm.appendChild(el("span", "u-no" + (/^S/.test(u.no) ? " x" : ""), unitLabel(u.no)));
      var t = el("span", "u-t");
      t.appendChild(el("b", null, u.title || "(제목 없음)"));
      if (u.grammar.length) {
        var g = el("span", "u-g");
        u.grammar.forEach(function (x) { g.appendChild(el("mark", null, x)); });
        t.appendChild(g);
      }
      sm.appendChild(t);
      sm.insertAdjacentHTML("beforeend", ICON.chev);
      sm.setAttribute("aria-label", (/^S/.test(u.no) ? "번외 단원" : u.no + "과") + " " + (u.title || "") + (u.grammar.length ? ", 문법 " + u.grammar.join(", ") : ""));
      d.appendChild(sm);
      var more = el("div", "u-more");
      function line(k, v) { if (!v) return; var r = el("div"); r.appendChild(el("span", "k", k)); r.appendChild(el("span", null, v)); more.appendChild(r); }
      line("본문", u.reading);
      line("말하기", u.functions.join(" · "));
      line("주제", u.theme);
      var cp = el("button", "btn"); cp.type = "button"; cp.innerHTML = ICON.copy; cp.appendChild(el("span", null, "이 단원 복사"));
      cp.addEventListener("click", function () { copyText(unitText(b, u)); });
      more.appendChild(cp);
      d.appendChild(more);
      wrap.appendChild(d);
    });
    return wrap;
  }
  function fold(title, content, open) {
    var d = el("details", "fold");
    if (open) d.open = true;
    var sm = el("summary"); sm.appendChild(el("span", null, title)); sm.insertAdjacentHTML("beforeend", ICON.chev);
    d.appendChild(sm);
    var inn = el("div", "fold-in"); inn.appendChild(content); d.appendChild(inn);
    return d;
  }
  function statusPill(s) { return el("span", "pill " + (s === "블로그 확인" ? "warn" : "bad"), s); }
  function bookLink(t) {
    var b = el("button", null, t.publisher + " " + t.author); b.type = "button";
    b.setAttribute("aria-label", t.publisher + " " + t.author + " 교과서 보기");
    b.addEventListener("click", function () { nav("#b-" + encodeURIComponent(serKey(t))); });
    return b;
  }

  /* 학교 화면: 중1 · 중2 · 중3 이 한 화면에 */
  function renderSchool(i) {
    var s = DATA.schools[i];
    setBack(true);
    app.textContent = "";
    var years = Object.keys(s.years).sort();
    var base = s.years["2026"] ? "2026" : years[0];
    var ph = el("header", "page-h");
    ph.appendChild(el("h1", null, s.school));
    ph.appendChild(el("p", "meta", regionShort(s.region) + (s.addr ? " · " + s.addr : "")));
    var acts = el("div", "acts");
    var mb = el("button", "btn"); mb.type = "button"; mb.innerHTML = ICON.star; mb.appendChild(el("span", null, "내 학교"));
    function syncMine() { var on = isMine(s.code); mb.setAttribute("aria-pressed", String(on)); mb.setAttribute("aria-label", on ? "내 학교에서 빼기" : "내 학교에 넣기"); }
    syncMine();
    mb.addEventListener("click", function () { toggleMine(s.code); syncMine(); });
    acts.appendChild(mb);
    if (typeof s.lat === "number") {
      var mv = el("button", "btn"); mv.type = "button"; mv.innerHTML = ICON.map; mv.appendChild(el("span", null, "지도에서 보기"));
      mv.addEventListener("click", function () { state.view = "map"; store("view", "map"); state.mpick = s.code; state.q = ""; state.region = s.region; homeY = 0; onHome = false; nav("#schools"); });
      acts.appendChild(mv);
    }
    ph.appendChild(acts);
    app.appendChild(ph);

    function gradeBlock(g) {
      var t = (s.years[base] || {})[g];
      var t27 = base === "2026" && s.years["2027"] ? s.years["2027"][g] : null;
      var sec = el("section", "grade");
      var head = el("div", "g-head");
      head.appendChild(paint(el("span", "g-tag", "중" + g), t ? pubColor(t.publisher) : PALETTE[6]));
      var h2 = el("h2");
      if (t) h2.appendChild(bookLink(t)); else h2.textContent = "자료 없음";
      head.appendChild(h2);
      sec.appendChild(head);
      if (!t) {
        sec.appendChild(el("p", "g-note", base + "학년도 교과서 목록을 학교가 공개하지 않았거나 찾지 못했습니다."));
      } else {
        var sub = el("div", "g-sub");
        sub.appendChild(el("span", null, base + "학년도 · " + t.curriculum + " 개정"));
        if (t.status !== "학교 확인") sub.appendChild(statusPill(t.status));
        if (t.source) { var a = el("a", null, t.status === "학교 확인" ? "학교 공지" : "근거 글"); a.href = t.source; a.target = "_blank"; a.rel = "noopener noreferrer"; sub.appendChild(a); }
        sec.appendChild(sub);
        if (t.status === "추정") sec.appendChild(el("p", "g-note", "이 학년도 목록이 공개되지 않아 전년도 목록으로 추정했습니다. 학교에 확인이 필요합니다."));
        var b = DATA.books[bookKey(t, g)];
        if (b) {
          if (!b.verified) sec.appendChild(el("p", "g-note", "단원은 교과서 원문이 아니라 문제집 목차와 학원 정리 글을 맞춰 본 것입니다."));
          sec.appendChild(unitList(b));
        } else sec.appendChild(el("p", "g-note", "이 교과서는 단원을 아직 정리하지 않았습니다."));
      }
      if (t27 && (!t || bookKey(t27, g) !== bookKey(t, g))) {
        var b27 = DATA.books[bookKey(t27, g)];
        var inner = el("div");
        var s27 = el("div", "g-sub"); s27.style.marginTop = "0";
        s27.appendChild(el("span", null, t27.curriculum + " 개정"));
        if (t27.source) { var a2 = el("a", null, "학교 공지"); a2.href = t27.source; a2.target = "_blank"; a2.rel = "noopener noreferrer"; s27.appendChild(a2); }
        var lk = el("a", null, "교과서 보기"); lk.href = "#b-" + encodeURIComponent(serKey(t27)); lk.addEventListener("click", function (e) { e.preventDefault(); nav(lk.getAttribute("href")); }); s27.appendChild(lk);
        inner.appendChild(s27);
        if (b27) inner.appendChild(unitList(b27)); else inner.appendChild(el("p", "g-note", "이 교과서는 단원을 아직 정리하지 않았습니다."));
        sec.appendChild(fold("2027학년도부터: " + t27.publisher + " " + t27.author, inner, !t));
      }
      return sec;
    }
    var glance = el("div", "glance"), blocks = {};
    ["1", "2", "3"].forEach(function (g) {
      var t = (s.years[base] || {})[g];
      var t27 = base === "2026" && s.years["2027"] ? s.years["2027"][g] : null;
      var b = el("button"); b.type = "button";
      b.appendChild(paint(el("span", "g-tag", "중" + g), t ? pubColor(t.publisher) : PALETTE[6]));
      var nm = el("span", "nm", t ? t.publisher + " " + t.author : "자료 없음");
      if (t27 && (!t || bookKey(t27, g) !== bookKey(t, g))) nm.appendChild(el("small", null, "2027학년도부터 " + t27.publisher + " " + t27.author));
      b.appendChild(nm);
      b.insertAdjacentHTML("beforeend", ICON.chev);
      b.setAttribute("aria-label", "중" + g + " " + (t ? t.publisher + " " + t.author : "자료 없음") + ", 단원으로 내려가기");
      b.addEventListener("click", function () { var h = blocks[g].querySelector(".g-head"); h.scrollIntoView({ block: "start" }); });
      glance.appendChild(b);
    });
    app.appendChild(glance);
    if (base !== "2026") app.appendChild(el("p", "hint", "이 학교는 2026학년도 목록을 찾지 못해 " + base + "학년도 교과서를 보여 줍니다."));
    ["1", "2", "3"].forEach(function (g) { blocks[g] = gradeBlock(g); app.appendChild(blocks[g]); });
  }

  /* 교과서 화면: 한 종의 학년별 단원과 쓰는 학교 */
  function renderBook(k) {
    var sr = SER[k];
    setBack(true);
    app.textContent = "";
    var ph = el("header", "page-h");
    ph.appendChild(el("h1", null, sr.publisher + " " + sr.author));
    var parts = ["1", "2", "3"].map(function (g) { var n = seriesCount(k, "2026", g); return n ? "중" + g + " " + n + "곳" : null; }).filter(Boolean);
    ph.appendChild(el("p", "meta", "2026학년도 " + (parts.join(" · ") || "쓰는 학교 없음")));
    app.appendChild(ph);
    [["2022", "1"], ["2022", "2"], ["2022", "3"], ["2015", "3"]].forEach(function (v) {
      var key = [sr.publisher, sr.author, v[0], v[1]].join("|");
      var b = DATA.books[key];
      var users = {};   // 학년도 → [학교 번호]
      DATA.schools.forEach(function (s, i) {
        Object.keys(s.years).forEach(function (y) { var t = s.years[y][v[1]]; if (t && bookKey(t, v[1]) === key) (users[y] || (users[y] = [])).push(i); });
      });
      if (!b && !Object.keys(users).length) return;
      var sec = el("section", "grade");
      var head = el("div", "g-head");
      head.appendChild(paint(el("span", "g-tag", "중" + v[1]), pubColor(sr.publisher)));
      head.appendChild(el("h2", null, "영어 " + v[1] + " (" + v[0] + " 개정)"));
      sec.appendChild(head);
      var sub = el("div", "g-sub");
      if (v[0] === "2015" || v[1] === "3") sub.appendChild(el("span", null, v[0] === "2015" ? "2026학년도까지 쓰는 책" : "2027학년도부터 쓰는 책"));
      if (b) {
        sub.appendChild(el("span", "pill " + (b.verified ? "ok" : "warn"), b.verified ? "교과서 원문 확인" : "2차 자료로 정리"));
        if (b.verified && b.source) { var a = el("a", null, "출판사 공개 원문"); a.href = b.source; a.target = "_blank"; a.rel = "noopener noreferrer"; sub.appendChild(a); }
      }
      sec.appendChild(sub);
      if (b && b.note) sec.appendChild(el("p", "g-note", b.note));
      if (b) sec.appendChild(unitList(b)); else sec.appendChild(el("p", "g-note", "이 교과서는 단원을 아직 정리하지 않았습니다."));
      (users["2026"] ? ["2026"] : Object.keys(users).sort().slice(-1)).forEach(function (y) {
        var box = el("div", "users");
        REGIONS.forEach(function (r) {
          var is = users[y].filter(function (i) { return DATA.schools[i].region === r; });
          if (!is.length) return;
          var grp = el("div");
          grp.appendChild(el("h3", null, regionShort(r) + " " + is.length + "곳"));
          var names = el("div", "names");
          is.forEach(function (i) {
            var nb = el("button", null, shortSchool(DATA.schools[i].school)); nb.type = "button";
            nb.addEventListener("click", function () { nav("#s-" + DATA.schools[i].code); });
            names.appendChild(nb);
          });
          grp.appendChild(names);
          box.appendChild(grp);
        });
        sec.appendChild(fold(y === "2026" ? "쓰는 학교 " + users[y].length + "곳" : y + "학년도에 쓰기로 한 학교 " + users[y].length + "곳 (공개한 학교만)", box, false));
      });
      app.appendChild(sec);
    });
  }

  fetch("data/textbooks.json", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (d) {
    DATA = d;
    d.schools.forEach(function (s, i) {
      if (REGIONS.indexOf(s.region) < 0) REGIONS.push(s.region);
      Object.keys(s.years).forEach(function (y) {
        Object.keys(s.years[y]).forEach(function (g) {
          var t = s.years[y][g], k = serKey(t);
          var sr = SER[k] || (SER[k] = { publisher: t.publisher, author: t.author, use: {}, cur: {} });
          sr.cur[t.curriculum] = true;
          var u = sr.use[y] || (sr.use[y] = {});
          (u[g] || (u[g] = [])).push(i);
        });
      });
    });
    Object.keys(d.books).forEach(function (key) {
      var b = d.books[key], k = b.publisher + "|" + b.author;
      if (!SER[k]) SER[k] = { publisher: b.publisher, author: b.author, use: {}, cur: {} };
      SER[k].cur[b.curriculum] = true;
    });
    var ORDER = ["경기 수원", "경기 화성", "경기 용인", "경기 오산"];
    REGIONS.sort(function (a, b) { return (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99); });
    SERKEYS = Object.keys(SER).sort(function (a, b) { return seriesTotal(b) - seriesTotal(a) || a.localeCompare(b, "ko"); });
    var v = recall("view"); if (v === "list" || v === "map" || v === "books") state.view = v;
    var rg = recall("region"); if (rg === "all" || REGIONS.indexOf(rg) >= 0) state.region = rg;
    var mg = recall("mgrade"); if (mg === "1" || mg === "2" || mg === "3") state.mgrade = mg;
    var foot = document.getElementById("foot");
    foot.appendChild(el("p", null, "학교 " + d.schools.length + "곳 (경기 " + REGIONS.map(regionShort).join(" · ") + "), 단원을 정리한 교과서 " + Object.keys(d.books).length + "권 · 자료 정리일 " + d.updated));
    foot.appendChild(el("p", null, "따로 표시가 없으면 학교 누리집 공지에서 확인한 값입니다. \"블로그 확인\"은 학원 블로그 두 곳 이상, \"추정\"은 전년도 목록 기준입니다."));
    route();
  }).catch(function () {
    app.textContent = "";
    var e = el("div", "empty"); e.appendChild(el("b", null, "교과서 자료를 불러오지 못했습니다")); e.appendChild(el("span", null, "새로 고침해 보세요.")); app.appendChild(e);
  });
})();
</script>
</body>
</html>
