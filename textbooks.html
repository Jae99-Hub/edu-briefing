<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 사진 앱의 프로필 화면처럼. 위에 지역 동그라미와 검색, 학교를 고르면
   프로필(학교 이름, 학년 동그라미 3개, 숫자 세 개)과 단원 격자 3열이 나온다.
   색은 라즈베리 하나만 작은 표시에 쓰고 넓은 면은 옅은 톤만. 그림자·그러데이션 없음. */
:root {
  --ground: #ffffff;
  --raised: #f3f4f6;
  --raised-2: #e7e8ec;
  --border: #e5e7eb;
  --text: #0f1115;
  --muted: #5f6672;
  --accent: #cc4210;
  --accent-soft: #fff1e8;
  --accent-track: #ffd9c2;
  --accent-ink: #7a2606;
  --marker: #ffe14d;
  --on-accent: #ffffff;
  --ok-bg: #dcfce7; --ok-fg: #14532d;
  --warn-bg: #fffbeb; --warn-fg: #92400e;
  --bad-bg: #ffedea; --bad-fg: #831c1e;
  --scrim: rgba(15, 17, 21, .5);
  --font: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000; --raised: #121212; --raised-2: #1f1f1f; --border: #262626;
    --text: #f5f5f5; --muted: #a8a8a8;
    --accent: #ff7a45; --accent-soft: #2b1308; --accent-track: #4a2210; --accent-ink: #ffd2bd; --on-accent: #120309;
    --ok-bg: #12301f; --ok-fg: #a7e3bd; --warn-bg: #33270d; --warn-fg: #f3d08a; --bad-bg: #3a1813; --bad-fg: #f5b4a7;
    --scrim: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000; --raised: #121212; --raised-2: #1f1f1f; --border: #262626;
  --text: #f5f5f5; --muted: #a8a8a8;
  --accent: #ff7a45; --accent-soft: #2b1308; --accent-track: #4a2210; --accent-ink: #ffd2bd; --on-accent: #120309;
  --ok-bg: #12301f; --ok-fg: #a7e3bd; --warn-bg: #33270d; --warn-fg: #f3d08a; --bad-bg: #3a1813; --bad-fg: #f5b4a7;
  --scrim: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); margin: 0; }
body { padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
body { color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gutter { max-width: 935px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 맨 위 막대 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ground); border-bottom: 1px solid var(--border); }
.top .gutter { height: 56px; display: flex; align-items: center; gap: 8px; }
.top .title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark { width: 28px; height: 28px; flex: none; }
.mark rect { fill: var(--accent); }
.mark path { stroke: var(--on-accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.icon-btn { width: 44px; height: 44px; flex: none; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .1s; }
.icon-btn:hover { background: var(--raised); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 24px; height: 24px; }
.views { display: flex; background: var(--raised); border-radius: 8px; padding: 3px; gap: 2px; flex: none; }
.views a { display: flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--muted); }
.views a[aria-current="page"] { background: var(--ground); color: var(--text); font-weight: 700; }

/* 지역 동그라미 */
.regions { display: flex; gap: 14px; overflow-x: auto; padding: 16px 0 12px; scrollbar-width: none; }
.regions::-webkit-scrollbar { display: none; }
.region { flex: none; width: 72px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ring { width: 66px; height: 66px; border-radius: 50%; padding: 2px; background: var(--raised-2); display: grid; place-items: center; transition: transform .15s; }
.region[aria-pressed="true"] .ring { background: var(--accent); padding: 3px; }
.region:active .ring { transform: scale(.94); }
.bubble { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--ground); background: var(--raised); display: grid; place-items: center; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.region[aria-pressed="true"] .bubble { background: var(--accent-soft); color: var(--accent-ink); }
.region .lab { font-size: 12px; color: var(--muted); }
.region[aria-pressed="true"] .lab { color: var(--text); font-weight: 500; }

/* 검색 */
.search { position: relative; margin: 4px 0 8px; }
.search input { width: 100%; height: 40px; border: 0; border-radius: 8px; background: var(--raised); padding: 0 12px 0 38px; font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

/* 검색 결과 줄 */
.rows { display: flex; flex-direction: column; padding: 4px 0 24px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; }
.row:hover .r-name { text-decoration: underline; text-underline-offset: 3px; }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.avatar.pri { background: var(--accent-soft); color: var(--accent-ink); }
.r-txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.r-name { font-size: 15px; font-weight: 700; }
.r-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group { font-size: 15px; font-weight: 700; margin: 18px 0 2px; }
.count { font-size: 13px; color: var(--muted); padding: 4px 0; }

/* 프로필 */
.profile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 24px; align-items: center; padding: 20px 0 8px; }
@media (min-width: 735px) { .profile { gap: 16px 64px; padding: 32px 32px 12px; } }
.p-av { width: 86px; height: 86px; border-radius: 50%; background: var(--marker); color: #111111; box-shadow: 0 0 0 3px var(--ground), 0 0 0 6px var(--accent); margin: 6px; display: grid; place-items: center; font-size: 34px; font-weight: 700; }
@media (min-width: 735px) { .p-av { width: 150px; height: 150px; font-size: 56px; } }
.p-main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.p-name { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.p-name h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; text-wrap: balance; }
.stats { display: flex; gap: 22px; margin: 0; padding: 0; list-style: none; }
.stats li { display: flex; flex-direction: column; line-height: 1.25; }
@media (min-width: 735px) { .stats li { flex-direction: row; gap: 4px; align-items: baseline; } }
.stats b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }
.bio { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
@media (min-width: 735px) { .bio { grid-column: 2; } }
.bio .b-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.bio a { font-weight: 500; text-decoration: none; color: var(--accent); }
.bio a:hover { text-decoration: underline; }
.bio .muted { color: var(--muted); }
.pill { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
.pill.neutral { background: var(--raised); color: var(--muted); }
.years { display: flex; gap: 6px; }
.yr { border: 0; border-radius: 8px; height: 32px; padding: 0 14px; background: var(--raised); font-size: 14px; font-weight: 700; cursor: pointer; }
.yr[aria-pressed="true"] { background: var(--text); color: var(--ground); }

/* 학년 동그라미 (하이라이트) */
.highlights { display: flex; gap: 20px; padding: 16px 0 20px; overflow-x: auto; scrollbar-width: none; }
@media (min-width: 735px) { .highlights { padding-left: 32px; gap: 36px; } }
.hl { flex: none; width: 80px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.hl .ring { width: 68px; height: 68px; }
.hl[aria-pressed="true"] .ring { background: var(--c); padding: 3px; }
.hl .bubble { font-size: 17px; background: var(--c); color: var(--c-ink); }
.hl .lab { font-size: 12px; line-height: 1.35; max-width: 80px; }
.hl:disabled { cursor: default; opacity: .45; }

/* 탭 */
.tabs { display: flex; justify-content: center; gap: 48px; border-top: 1px solid var(--border); }
.tab { display: flex; align-items: center; gap: 6px; height: 48px; border: 0; background: none; border-top: 1px solid transparent; margin-top: -1px; color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; }
.tab svg { width: 16px; height: 16px; }
.tab[aria-selected="true"] { color: var(--text); border-top-color: var(--text); }

/* 단원 격자 */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; }
@media (min-width: 735px) { .grid { gap: 4px; margin: 0; } }
.tile { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border: 0; padding: 10px; background: var(--c); color: var(--c-ink); text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; overflow: hidden; transition: filter .15s, transform .1s; }
.tile:hover { filter: brightness(1.06); }
.tile:active { transform: scale(.98); }
.tile .no { font-size: clamp(26px, 8.4vw, 44px); font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.tile .no small { font-size: .4em; font-weight: 700; margin-left: 2px; }
.tile .t { font-size: clamp(12px, 3.4vw, 15px); font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .g { align-self: flex-start; max-width: 100%; font-size: 11.5px; font-weight: 800; background: var(--mk); color: #111111; padding: 1px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.extra { background: #111111; color: #ffffff; }
.tile.extra .no { font-size: clamp(16px, 4.6vw, 24px); }

/* 단원 목록 */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--border); }
.li .no { font-size: 22px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.li .no.extra { font-size: 13px; color: var(--accent); padding-top: 4px; }
.li .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.li .t { font-weight: 700; }
.li .gr b, .sheet .k { font-weight: 700; }
.li .fn, .li .th, .li .rd { font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { .li { grid-template-columns: 40px minmax(0, 1fr); } .li .copy { grid-column: 2; justify-self: start; } }
.copy { border: 0; border-radius: 8px; min-height: 44px; padding: 0 16px; background: var(--raised); font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .1s; }
.copy:active { transform: scale(.96); }
.copy.primary { background: var(--accent); color: var(--on-accent); min-height: 44px; flex: 1; }

/* 쓰는 학교 탭 */
.users { display: flex; flex-direction: column; gap: 4px; padding: 12px 0 24px; }
.users h2 { font-size: 15px; margin: 14px 0 2px; }
.users p { margin: 0; font-size: 14px; }
.users p b { font-weight: 700; margin-right: 6px; }

/* 비었을 때 */
.empty { padding: 48px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty b { color: var(--text); font-size: 17px; }

/* 단원 크게 보기 */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 735px) { .scrim { align-items: center; } }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--ground); border-radius: 16px 16px 0 0; padding: 8px max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
@media (min-width: 735px) { .sheet { border-radius: 12px; padding: 8px 24px 24px; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--raised-2); margin: 4px auto 0; }
.s-head { display: flex; align-items: center; gap: 10px; }
.s-head .avatar { width: 36px; height: 36px; font-size: 14px; }
.s-head .who { flex: 1; min-width: 0; line-height: 1.3; }
.s-head .who b { display: block; font-size: 14px; }
.s-head .who span { font-size: 12px; color: var(--muted); }
.sheet h2 { margin: 0; font-size: 26px; line-height: 1.25; letter-spacing: -0.03em; text-wrap: balance; }
.sheet .reading { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.facts { display: flex; flex-direction: column; gap: 10px; margin: 0; }
.facts div { display: flex; flex-direction: column; gap: 4px; }
.facts dt { font-size: 13px; color: var(--muted); }
.facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 12px; border-radius: 8px; background: var(--raised); font-size: 15px; font-weight: 500; }
.facts .gram .chip { background: var(--accent-soft); color: var(--accent-ink); }
.s-actions { display: flex; gap: 8px; padding-top: 4px; }
.ureels { position: fixed; inset: 0; z-index: 45; background: #000; }
.u-track { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.u-track::-webkit-scrollbar { display: none; }
.ureel { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--c); color: var(--c-ink); display: flex; justify-content: center; }
.ureel-in { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; gap: 14px; padding: calc(env(safe-area-inset-top, 0px) + 66px) 0 calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-left, 0px)); }
.ureel .big { font-size: clamp(64px, 20vw, 96px); font-weight: 800; line-height: .95; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.ureel .big small { font-size: .35em; margin-left: 4px; }
.ureel h2 { margin: 0; padding-right: 18px; font-size: clamp(30px, 8.6vw, 42px); font-weight: 800; line-height: 1.15; letter-spacing: -0.04em; text-wrap: balance; }
.ureel .rd { margin: 0; padding-right: 18px; font-size: 15px; font-weight: 600; opacity: .9; }
.ureel .low { margin-top: auto; display: flex; align-items: flex-end; gap: 12px; }
.ureel .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.ureel .k { font-size: 12px; font-weight: 800; opacity: .85; margin-bottom: 4px; }
.ureel .gram { display: flex; flex-wrap: wrap; gap: 6px; }
.ureel .gram mark { background: var(--mk); color: #111111; font-size: 19px; font-weight: 800; padding: 2px 8px; letter-spacing: -0.02em; }
.ureel .fns { font-size: 15px; font-weight: 600; line-height: 1.5; }
.ureel .side { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-right: 4px; }
.ureel .side button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; color: inherit; font-size: 12px; font-weight: 700; cursor: pointer; min-width: 48px; min-height: 48px; }
.ureel .side svg { width: 30px; height: 30px; }
.ureel .side .n { font-size: 13px; font-weight: 800; }
.u-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; padding-top: env(safe-area-inset-top, 0px); pointer-events: none; }
.u-bar-in { width: 100%; max-width: 520px; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 0 max(18px, env(safe-area-inset-left, 0px)); pointer-events: auto; }
.u-bar .ttl { font-size: 16px; font-weight: 800; color: #ffffff; background: rgba(0,0,0,.4); padding: 6px 12px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-bar .icon-btn { color: #ffffff; background: rgba(0,0,0,.4); }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0; z-index: 60; background: var(--text); color: var(--ground); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

footer { border-top: 1px solid var(--border); margin-top: 32px; padding-block: 20px 40px; color: var(--muted); font-size: 12px; line-height: 1.7; }
footer p { margin: 0 0 4px; }

.skel { display: block; border-radius: 8px; background: var(--raised); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* 인스타 탐색 탭처럼: 색 격자 */
.explore { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
@media (min-width: 735px) { .explore { gap: 4px; margin: 0; } }
.xt { aspect-ratio: 4 / 5; max-width: 100%; border: 0; padding: 10px; background: var(--c); color: var(--c-ink); text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; overflow: hidden; font: inherit; transition: filter .15s, transform .1s; }
.xt:hover { filter: brightness(1.06); }
.xt:active { transform: scale(.98); }
.xt .nm { font-size: clamp(19px, 5.8vw, 28px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; word-break: keep-all; }
.xt .sub { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1.25; min-width: 0; max-width: 100%; }
.xt mark { background: var(--mk); color: #111111; padding: 1px 4px; font-size: 11.5px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xt .meta { opacity: .9; }
.group { margin: 22px 0 8px; }
.count { padding: 4px 0 8px; }

<script>
(function () {

  /* 학교 찾기 */

      function sync() { var on = isMine(s.code); st.setAttribute("aria-pressed", String(on)); st.setAttribute("aria-label", s.school + (on ? " 내 학교에서 빼기" : " 내 학교에 넣기")); }

    if (ov && !/~u$/.test(raw) && ov.__close) ov.__close();
    if (/~u$/.test(raw) && !ov) { try { history.replaceState(null, "", h || "#schools"); } catch (e) {} }
    if (h === lastBase && DATA) return;   // 단원 크게 보기만 닫힌 경우: 화면은 그대로
    var bm = /^#b-(\d+)$/.exec(h), sm = /^#s-(\d+)$/.exec(h);
    var v = (h === "#books" || bm) ? "books" : "schools";
    state.view = v;
    document.getElementById("v-schools").setAttribute("aria-current", v === "schools" ? "page" : "false");
    document.getElementById("v-books").setAttribute("aria-current", v === "books" ? "page" : "false");
    if (!DATA) return;
    lastBase = h;
    window.scrollTo(0, 0);
    if (bm && ALLKEYS[+bm[1]]) { state.book = ALLKEYS[+bm[1]]; renderBook(); return; }
    if (v === "books") { state.book = null; renderBookSearch(); return; }
    if (sm) {
      var i = DATA.schools.findIndex(function (s) { return s.code === sm[1]; });
      if (i >= 0) { state.school = i; state.region = DATA.schools[i].region; renderProfile(); return; }
    }
    state.school = -1;
    renderSchoolSearch();
  }
  document.getElementById("v-schools").addEventListener("click", function (e) { e.preventDefault(); if (location.hash.replace(/~u$/, "") !== "#schools") nav("#schools"); });
  document.getElementById("v-books").addEventListener("click", function (e) { e.preventDefault(); if (location.hash.replace(/~u$/, "") !== "#books") nav("#books"); });
  window.addEventListener("hashchange", route);
  route();

  fetch("data/textbooks.json", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (d) {
    DATA = d;
    BOOKS = Object.keys(d.books);
    var all = {};
    BOOKS.forEach(function (k) { all[k] = true; });
    d.schools.forEach(function (s) { Object.keys(s.years).forEach(function (y) { Object.keys(s.years[y]).forEach(function (g) { all[bookKey(s.years[y][g], g)] = true; }); }); });
    ALLKEYS = Object.keys(all).sort(function (a, b) {
      var A = a.split("|"), B = b.split("|");
      return (B[2] - A[2]) || (A[3] - B[3]) || (usedCount(b) - usedCount(a)) || a.localeCompare(b, "ko");
    });
    state.region = recall("region");
    var t = recall("tab"); if (t) state.tab = t;
    var code = recall("school");
    if (code && !/^#(s-\d+|b-\d+|books|schools)/.test(location.hash)) {
      var i = d.schools.findIndex(function (s) { return s.code === code; });
      if (i >= 0) { state.region = d.schools[i].region; try { history.replaceState(null, "", "#s-" + code); } catch (e) {} }
    }
    var regs = [];
    d.schools.forEach(function (s) { var r = regionShort(s.region); if (regs.indexOf(r) < 0) regs.push(r); });
    var foot = document.getElementById("foot");
    foot.appendChild(el("p", null, "학교 " + d.schools.length + "곳 (경기 " + regs.join(" · ") + "), 단원 정리된 교과서 " + BOOKS.length + "권 · 자료 정리일 " + d.updated));
    foot.appendChild(el("p", null, "\"학교 확인\"은 학교 누리집 공지, \"블로그 확인\"은 학원 블로그 두 곳 이상, \"추정\"은 전년도 목록 기준입니다."));
    route();
  }).catch(function () {
    app.textContent = "";
    var e = el("div", "empty"); e.appendChild(el("b", null, "교과서 자료를 불러오지 못했습니다")); e.appendChild(el("span", null, "새로 고침해 보세요.")); app.appendChild(e);
  });
})();
</script>
</body>
</html>
